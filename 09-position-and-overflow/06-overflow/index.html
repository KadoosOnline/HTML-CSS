<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overflow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <p>overflow: hidden</p>
    <div class="box hidden-box">
        این یک متن طولانی است که در باکس جا نمی‌شود و بخشی از آن با overflow: hidden پنهان می‌شود.
    </div>

    <p>overflow: auto</p>
    <div class="box auto-box">
        این یک متن طولانی است که در باکس جا نمی‌شود و با overflow: auto اسکرول‌بار نمایش داده می‌شود.
    </div>

</body>
</html>
