<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سایه‌ها</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>سایه در CSS</h1>

    <h2>سایه جعبه (box-shadow)</h2>
    <div class="boxes">
        <div class="box shadow-1">سایه ملایم</div>
        <div class="box shadow-2">سایه متوسط</div>
        <div class="box shadow-3">سایه رنگی</div>
        <div class="box shadow-4">سایه داخلی</div>
    </div>

    <h2>سایه متن (text-shadow)</h2>
    <div class="banner">
        <h3 class="banner-title">عنوان با سایه متن</h3>
    </div>

    <h2>کارتی که با hover سایه‌اش بیشتر می‌شود</h2>
    <div class="card">
        <h3>دوره HTML و CSS</h3>
        <p>موس را روی این کارت ببرید.</p>
    </div>

</body>
</html>
