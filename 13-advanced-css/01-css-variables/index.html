<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متغیرهای CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>متغیرهای CSS (CSS Variables)</h1>
    <p>
        تا اینجا هر بار رنگ‌ها را دستی می‌نوشتیم. با متغیر، رنگ را یک بار تعریف
        می‌کنیم و همه جا از آن استفاده می‌کنیم. برای تغییر رنگ سایت فقط یک خط عوض می‌شود.
    </p>

    <div class="boxes">
        <div class="box box-primary">رنگ اصلی</div>
        <div class="box box-accent">رنگ تاکیدی</div>
        <div class="box box-light">رنگ روشن</div>
    </div>

    <button class="btn">دکمه با متغیر</button>

</body>
</html>
