<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Text Tags</title>
</head>
<body>

    <h1>تگ‌های متنی</h1>

    <p>
        این متن <strong>مهم</strong> است.
    </p>

    <p>
        این متن <em>تاکید شده</em> است.
    </p>

    <p>
        این متن <mark>هایلایت</mark> شده است.
    </p>

    <p>
        H<sub>2</sub>O
    </p>

    <p>
        x<sup>2</sup>
    </p>

</body>
</html>
