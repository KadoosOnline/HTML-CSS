<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلکتور کلاس</title>
    <style>
        h1 {
            color: blue;
        }

        p {
            color: green;
            font-size: 18px;
        }

        .note {
            color: orangered;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>معرفی من</h1>

    <p>
        من علی هستم و در حال یادگیری CSS هستم.
    </p>

    <p class="note">
        این پاراگراف با کلاس note استایل متفاوتی دارد.
    </p>

    <p class="note">
        این پاراگراف هم همان کلاس note را دارد.
    </p>

    <h2 class="note">متن h2</h2>

</body>
</html>
