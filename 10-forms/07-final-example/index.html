<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تماس با آموزشگاه کادوس</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <h1>کادوس</h1>
        <nav>
            <a href="#">خانه</a>
            <a href="#">دوره‌ها</a>
            <a href="#">تماس با ما</a>
        </nav>
    </header>

    <main>
        <h2>فرم تماس با ما</h2>

        <form>
            <label for="fullname">نام و نام‌خانوادگی:</label>
            <input type="text" id="fullname" name="fullname">

            <label for="email">ایمیل:</label>
            <input type="email" id="email" name="email">

            <label for="phone">شماره تماس:</label>
            <input type="tel" id="phone" name="phone">

            <label for="course">دوره مورد نظر:</label>
            <select id="course" name="course">
                <option value="html-css">HTML و CSS</option>
                <option value="python">Python</option>
                <option value="icdl">ICDL</option>
            </select>

            <label for="message">پیام شما:</label>
            <textarea id="message" name="message" rows="4"></textarea>

            <div class="radio-group">
                <p>روش ارتباطی ترجیحی:</p>
                <input type="radio" id="contact-email" name="contact" value="email">
                <label for="contact-email">ایمیل</label>

                <input type="radio" id="contact-phone" name="contact" value="phone">
                <label for="contact-phone">تماس تلفنی</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="agree" name="agree">
                <label for="agree">قوانین آموزشگاه را می‌پذیرم</label>
            </div>

            <button type="submit">ارسال فرم</button>
        </form>
    </main>

</body>
</html>
