<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تماس با دبیرستان دانش - آدرس، شماره تلفن، ایمیل و فرم ارتباط با ما">
    <title>تماس با ما - دبیرستان دانش</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <div class="logo">
            <span>🎓</span>
            <span>دبیرستان دانش</span>
        </div>
        <nav>
            <a href="index.html">خانه</a>
            <a href="about.html">درباره ما</a>
            <a href="programs.html">رشته‌های تحصیلی</a>
            <a href="teachers.html">دبیران</a>
            <a href="gallery.html">گالری تصاویر</a>
            <a href="news.html">اخبار</a>
            <a href="contact.html" class="active">تماس با ما</a>
        </nav>
    </header>

    <div class="page-banner" style="background-image: linear-gradient(rgba(20, 40, 40, 0.7), rgba(20, 40, 40, 0.7)), url('images/about-building.jpg');">
        <h1>تماس با ما</h1>
    </div>

    <section class="container">
        <div class="contact-page">
            <div class="contact-info">
                <h2>اطلاعات تماس</h2>
                <p>آدرس: تهران، خیابان آزادی، پلاک ۱۲</p>
                <p>تلفن: ۰۲۱-۱۲۳۴۵۶۷۸</p>
                <p>ایمیل: info@daneshschool.ir</p>
                <p>ساعات کاری: شنبه تا چهارشنبه، ۷:۳۰ تا ۱۴:۳۰</p>
            </div>

            <div class="contact-form-wrapper">
                <h2>فرم تماس</h2>
                <form>
                    <label for="fullname">نام و نام‌خانوادگی:</label>
                    <input type="text" id="fullname" name="fullname">

                    <label for="email">ایمیل:</label>
                    <input type="email" id="email" name="email">

                    <label for="subject">موضوع:</label>
                    <select id="subject" name="subject">
                        <option value="admission">ثبت‌نام</option>
                        <option value="programs">رشته‌های تحصیلی</option>
                        <option value="other">سایر</option>
                    </select>

                    <label for="message">پیام شما:</label>
                    <textarea id="message" name="message" rows="4"></textarea>

                    <button type="submit" class="btn">ارسال پیام</button>
                </form>
            </div>
        </div>
    </section>

    <footer class="site-footer">
        <p>تمامی حقوق برای دبیرستان دانش محفوظ است.</p>
    </footer>

</body>
</html>
